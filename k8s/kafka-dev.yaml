apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: oms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka.oms.svc.cluster.local:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: oms
spec:
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: oms
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-topic-init
          image: apache/kafka:3.7.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              bootstrap_server="kafka.oms.svc.cluster.local:9092"

              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$bootstrap_server" --list >/dev/null 2>&1; do
                echo "Waiting for Kafka at $bootstrap_server..."
                sleep 5
              done

              ensure_topic() {
                topic="$1"
                partitions="$2"

                /opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server "$bootstrap_server" \
                  --create \
                  --if-not-exists \
                  --topic "$topic" \
                  --partitions "$partitions" \
                  --replication-factor 1

                current_partitions=$(/opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server "$bootstrap_server" \
                  --describe \
                  --topic "$topic" \
                  | awk -F'PartitionCount: ' '{print $2}' \
                  | awk '{print $1}')

                if [ "$current_partitions" -lt "$partitions" ]; then
                  /opt/kafka/bin/kafka-topics.sh \
                    --bootstrap-server "$bootstrap_server" \
                    --alter \
                    --topic "$topic" \
                    --partitions "$partitions"
                fi
              }

              ensure_topic auth.user_logged_in 1
              ensure_topic auth.service_token_issued 1
              ensure_topic employee.created 1
              ensure_topic notification.email_status 1
              ensure_topic report.requested 1
              ensure_topic report.cancelled 1
              ensure_topic operations.client_created 1
              ensure_topic operations.performer.created 1
              ensure_topic operations.performer.updated 1
              ensure_topic operations.shift.created 1
              ensure_topic operations.shift.status_changed 3
              ensure_topic operations.shift.offer_campaign_created 1
              ensure_topic operations.shift.offer_sent 1
              ensure_topic operations.shift.offer_viewed 1
              ensure_topic operations.shift.offer_declined 1
              ensure_topic operations.shift.offer_won 1
              ensure_topic operations.shift.offer_lost 1
              ensure_topic operations.shift.performer_assigned 1
              ensure_topic operations.shift.closed 1
              ensure_topic operations.timesheet.submitted 1
