kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: oms-cluster
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
    extraMounts:
      - hostPath: "D:\\ProjectsDocker\\extrawork\\.runtime\\oms1-postgres-data"
        containerPath: /mnt/oms-data/oms1-postgres-data
      - hostPath: "D:\\ProjectsDocker\\extrawork\\.runtime\\oms2-postgres-data"
        containerPath: /mnt/oms-data/oms2-postgres-data
      - hostPath: "D:\\ProjectsDocker\\extrawork\\.runtime\\oms3-postgres-data"
        containerPath: /mnt/oms-data/oms3-postgres-data
      - hostPath: "D:\\ProjectsDocker\\extrawork\\.runtime\\oms4-postgres-data"
        containerPath: /mnt/oms-data/oms4-postgres-data
      - hostPath: "D:\\ProjectsDocker\\extrawork\\.runtime\\oms5-postgres-data"
        containerPath: /mnt/oms-data/oms5-postgres-data
      - hostPath: "D:\\ProjectsDocker\\extrawork\\.runtime\\oms3-reports-data"
        containerPath: /mnt/oms-data/oms3-reports-data
